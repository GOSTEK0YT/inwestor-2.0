<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Energetyk 2x EXP</title>
  <desc id="desc">Czarna puszka energetyka z turkusową błyskawicą i napisem 2x EXP przez 5 minut.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="58%">
      <stop offset="0" stop-color="#0ff5d2" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#0d2d32" stop-opacity=".65"/>
      <stop offset="1" stop-color="#121821"/>
    </radialGradient>
    <linearGradient id="can" x1="25%" x2="80%" y1="0" y2="100%">
      <stop offset="0" stop-color="#313c49"/>
      <stop offset=".18" stop-color="#0b0f15"/>
      <stop offset=".5" stop-color="#1d2833"/>
      <stop offset=".72" stop-color="#07090d"/>
      <stop offset="1" stop-color="#303743"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#0ce6c6"/>
      <stop offset="1" stop-color="#62ffe3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" rx="46" fill="#101722"/>
  <rect x="34" y="34" width="832" height="832" rx="32" fill="url(#bgGlow)" stroke="#39526e" stroke-width="3"/>
  <ellipse cx="450" cy="700" rx="168" ry="28" fill="#0ff5d2" opacity=".22" filter="url(#glow)"/>
  <g transform="translate(0 8)">
    <ellipse cx="450" cy="198" rx="116" ry="24" fill="#1e2833" stroke="#79fff0" stroke-width="4"/>
    <path d="M334 198c0-18 232-18 232 0v482c0 36-24 58-116 58s-116-22-116-58z" fill="url(#can)" stroke="#253444" stroke-width="4"/>
    <ellipse cx="450" cy="680" rx="116" ry="24" fill="#111821" stroke="#253444" stroke-width="4"/>
    <path d="M486 286 402 452h74l-52 152 140-220h-76z" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="450" y="518" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" fill="#f4f8f6" letter-spacing="2">ENERGETYK</text>
    <rect x="352" y="550" width="196" height="62" rx="12" fill="none" stroke="#0ff5d2" stroke-width="4"/>
    <text x="450" y="599" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" fill="#0ff5d2">2X EXP</text>
    <text x="450" y="656" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#f4f8f6" letter-spacing="4">5 MINUT</text>
  </g>
  <g transform="translate(140 735)">
    <rect x="0" y="0" width="620" height="88" rx="18" fill="rgba(14,20,29,.72)" stroke="#39526e" stroke-width="3"/>
    <circle cx="70" cy="44" r="30" fill="none" stroke="#0ff5d2" stroke-width="8"/>
    <path d="M70 25v22l15 13" fill="none" stroke="#0ff5d2" stroke-width="8" stroke-linecap="round"/>
    <text x="140" y="38" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#0ff5d2">2X EXP</text>
    <text x="140" y="70" font-family="Arial, sans-serif" font-size="28" fill="#f4f8f6">PRZEZ 5 MINUT</text>
  </g>
</svg>
